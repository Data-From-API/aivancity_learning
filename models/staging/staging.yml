version: 2

models:
  - name: stg_customers
    description: >
      Staging table for customers.  
      Sourced from `dim_customers`, contains basic demographic and loyalty information.
    columns:
      - name: customer_id
        description: "ID of the customer. Unique identifier."
        tests:
          - unique
          - not_null
      - name: first_name
        description: "Customer's first name."
        tests:
          - not_null
      - name: last_name
        description: "Customer's last name."
        tests:
          - not_null
      - name: fullname
        description: "Concatenation of first_name and last_name."
        tests:
          - not_null
      - name: gender
        description: "Customer's reported gender."
      - name: is_loyalty_member
        description: "Boolean flag indicating if the customer is enrolled in the loyalty program."
        tests:
          - not_null
      - name: loyalty_level
        description: "Loyalty tier or membership level of the customer (e.g., Silver, Gold, Platinum)."
      - name: signup_date
        description: "Date when the customer signed up."
        tests:
          - not_null

  - name: stg_products
    description: >
      Staging table for products.  
      Sourced from `dim_products`, contains product identifiers, names, and classification.
    columns:
      - name: product_id
        description: "ID of the product. Unique identifier."
        tests:
          - unique
          - not_null
      - name: product_name
        description: "Name of the product."
        tests:
          - not_null
      - name: brand
        description: "Brand associated with the product."
      - name: category
        description: "High-level category of the product."
      - name: subcategory
        description: "More granular subcategory of the product."

  - name: stg_stores
    description: >
      Staging table for stores.  
      Sourced from `dim_stores`, contains store metadata and location attributes.
    columns:
      - name: store_id
        description: "ID of the store. Unique identifier."
        tests:
          - unique
          - not_null
      - name: store_name
        description: "Human-readable name of the store."
        tests:
          - not_null
      - name: store_channel
        description: "Sales channel or format (e.g., Online, Brick-and-Mortar)."
        tests:
          - not_null
      - name: city
        description: "City where the store is located."
      - name: region
        description: "Geographic region or state where the store is located."

  - name: stg_sales
    description: >
      Staging table for raw sales transactions.  
      Sourced from `fact_sales`, contains one row per transaction line:
      sale_date, customer, product, store, amount, status.
    columns:
      - name: sale_date
        description: "Date of the sale (DATE)."
        tests:
          - not_null
      - name: customer_id
        description: "ID of the customer who made the purchase."
        tests:
          - not_null
          - relationships:
              to: ref('stg_customers')
              field: customer_id
      - name: key_transaction_id
        description: >
          Unique key for each transaction, constructed as 
          `CONCAT(date(sale_date), '_', customer_id, '_', product_id)`."
        tests:
          - unique
          - not_null
      - name: store_id
        description: "ID of the store where the purchase occurred."
        tests:
          - not_null
          - relationships:
              to: ref('stg_stores')
              field: store_id
      - name: product_id
        description: "ID of the product that was sold."
        tests:
          - not_null
          - relationships:
              to: ref('stg_products')
              field: product_id
      - name: revenue_ordered
        description: "Raw order amount for the transaction (CAST AS FLOAT64)."
        tests:
          - not_null
      - name: revenue_billed
        description: "Billed amount for the transaction (CAST AS FLOAT64). Only positive values are retained in downstream models."
        tests:
          - not_null
      - name: status
        description: "Order status (e.g., completed, refunded, pending)."
        tests:
          - not_null

  - name: stg_sales_billed
    description: >
      Staging view for billed sales.  
      Filters `stg_sales` to include only transactions with `revenue_billed > 0` 
      over the last 12 months. Used downstream for RFM calculations.
    columns:
      - name: sale_date
        description: "Date of the sale (DATE)."
        tests:
          - not_null
      - name: customer_id
        description: "ID of the customer who made the purchase."
        tests:
          - not_null
      - name: key_transaction_id
        description: >
          Unique key for each billed transaction. Carries same definition as in `stg_sales`."
        tests:
          - unique
          - not_null
      - name: revenue_billed
        description: "Positive billed amount for the transaction."
        tests:
          - not_null

